name: PR Template Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  validate-pr-governance:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate required PR body fields and review metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [ -z "${PR_BODY:-}" ]; then
            echo "PR body is empty. Use .github/pull_request_template.md."
            exit 1
          fi

          missing=0
          require_section() {
            section="$1"
            if ! printf '%s\n' "$PR_BODY" | grep -Fq "$section"; then
              echo "Missing required section: $section"
              missing=1
            fi
          }

          require_section "## Role + Task Packet"
          require_section "## Scope + Acceptance Criteria"
          require_section "## Verification"
          require_section "## Files Changed"
          require_section "## Lane Metadata"
          require_section "## Review Gates"

          if ! printf '%s\n' "$PR_BODY" | grep -Eiq "^- Persona signature.*: .+"; then
            echo "Missing or empty persona signature line."
            missing=1
          fi

          require_gate_line() {
            gate="$1"
            if ! printf '%s\n' "$PR_BODY" | grep -Eiq "^- \\[[xX ]\\] ${gate}$"; then
              echo "Missing review gate line: ${gate}"
              missing=1
            fi
          }

          require_gate_line "Coding agent self-review completed"
          require_gate_line "Koad git review approved"
          require_gate_line "Ian review approved"

          if [ "${BASE_REF}" != "koad-os" ] && [ "${HEAD_REF}" != "koad-os" ]; then
            require_section "## Implementation Documentation"
            if ! printf '%s\n' "$PR_BODY" | grep -Eiq "^- Primary implementation doc: `docs/implementation/.+\\.md`$"; then
              echo "Missing or invalid implementation doc path line."
              missing=1
            fi
            if ! printf '%s\n' "$PR_BODY" | grep -Eiq "^- Changed-line coverage evidence: .+"; then
              echo "Missing changed-line coverage evidence line."
              missing=1
            fi
            if ! printf '%s\n' "$PR_BODY" | grep -Eiq "^- Automated test updates included: .+"; then
              echo "Missing automated test update evidence line."
              missing=1
            fi
          fi

          if [ "$missing" -ne 0 ]; then
            echo "PR governance validation failed."
            exit 1
          fi

          echo "PR governance validation passed."
